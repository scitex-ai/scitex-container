name: CLA Assistant

# Org-owned CLA policy. This leaf only preserves its triggers, permissions,
# repository-specific allowlist, and the one named storage secret.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    with:
      runs_on: '["ubuntu-latest"]'
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
