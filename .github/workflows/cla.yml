name: CLA Assistant

# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Triggers/permissions preserved verbatim from the prior local file.
# owner_allowlist override: this repo's prior allowlist was
# "bot*,ywatanabe1989,LLEmacs" (default is "bot*,ywatanabe1989"), so it is
# passed explicitly below. default_branch/owner_login defaults (main /
# ywatanabe1989) already match this repo's prior hardcoded values.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  owner-pr-bypass:
    name: CLAssistant
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor == 'ywatanabe1989'
    runs-on: ${{ fromJSON(vars.LIGHT_RUNS_ON || vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    permissions:
      statuses: write
    steps:
      - name: Mark the owner-authored PR head as accepted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/statuses/${SHA}" \
            -f state=success \
            -f context=CLAssistant \
            -f description="Owner-authored pull request (CLA allowlist bypass)"

  call:
    if: >-
      github.event_name != 'pull_request_target' ||
      github.actor != 'ywatanabe1989'
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    with:
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"
    secrets: inherit
