name: release

# Tag-driven release pipeline. Release jobs deliberately run on GitHub-hosted
# runners: the repository's CI_RUNS_ON variable selects the general-purpose
# scitex-org-cpu pool, which does not provide the legacy Spartan Apptainer shim
# or SIF used by this workflow before v0.4.3.
#
# workflow_dispatch is retained so an existing, unchanged tag can be released
# after a workflow repair. Every stage checks out and operates on that tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to publish (for example, v0.4.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${{ inputs.version }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"
          cache-dependency-glob: pyproject.toml
      - name: Install test environment
        run: |
          set -euo pipefail
          uv venv --seed --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e ".[all,dev]"
          uv pip install --python .venv/bin/python "pytest-xdist>=3.0.0"
      - name: Run tests
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          export PYTEST_XDIST_AUTO_NUM_WORKERS="$(.venv/bin/python -c 'import os; print(len(os.sched_getaffinity(0)))')"
          .venv/bin/python -m pytest tests/ -n auto \
            --cov=src/scitex_container --cov-report=xml --cov-report=term

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${{ inputs.version }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"
          cache-dependency-glob: pyproject.toml
      - name: Build wheel and source distribution
        run: |
          set -euo pipefail
          uv venv --seed --python 3.12 .venv
          uv pip install --python .venv/bin/python build
          .venv/bin/python -m build
          test -n "$(find dist -maxdepth 1 -type f -print -quit)" || {
            echo "::error::dist/ is empty"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-container
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.version }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \\[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release ${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
